services:
  postgres-churn-db:
    image: postgres:16
    environment:
      - POSTGRES_DB=telecom_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - 5450:5432
    volumes:
      - postgresdbdata:/var/lib/postgresql/data
    restart: always

volumes:
  postgresdbdata: